services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: lycees
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: lycees
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lycees"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
